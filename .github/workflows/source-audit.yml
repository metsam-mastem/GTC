name: GTC Source Health Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtc-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check selected source endpoints
        run: python tools/gtc_runtime.py source-audit --timeout 8
      - name: Upload source-health report
        uses: actions/upload-artifact@v4
        with:
          name: gtc-source-health
          path: generated/source-health.json
          if-no-files-found: error
          retention-days: 30
